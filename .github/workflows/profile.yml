name: profile

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python profile/render.py
      - name: Commit changes
        run: |
          git config user.name "Aditya Reddy"
          git config user.email "82123567+adityareddy-dev@users.noreply.github.com"
          git add -A profile/out README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "profile: weekly render"
            git push
          fi
